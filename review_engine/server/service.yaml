apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: architecture-reviewer-a2a
  labels:
    cloud.googleapis.com/location: us-central1
    app.kubernetes.io/name: architecture-reviewer-a2a
    environment: production
    managed-by: geminipostcutoff
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        # Post-Cutoff Directives:
        # 1. Execution environment gen2 for fast cold starts
        run.googleapis.com/execution-environment: gen2
        # 2. Continuous CPU allocation (prevents background review worker throttling)
        run.googleapis.com/cpu-throttling: "false"
        # 3. Scale-to-zero for FinOps serverless economics
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # 4. Direct VPC Egress (eliminates 2-VM idle connector fees)
        # Uncomment and populate with your project VPC subnet when deploying:
        # run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        # run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/geminipostcutoff/architecture-reviewer:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
            requests:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: MODEL_CALIBRATION
              value: "flash-3.8"
            - name: LOG_LEVEL
              value: "info"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
