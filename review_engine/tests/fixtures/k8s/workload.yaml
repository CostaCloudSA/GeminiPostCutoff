apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-frontend-ingress
  namespace: prod
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-service
            port:
              number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference-deployment
  namespace: ml
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app: vllm-server
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        securityContext:
          privileged: true
